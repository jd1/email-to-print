name: docker-pr-build

# Builds Docker images for SELECTED pull requests only.
# Add the `test-image` label to a PR to build (or rebuild) its image.
# Pushing new commits to a labeled PR rebuilds and overwrites the same tag.
# Remove the label to stop building. Images are deleted on PR close by
# docker-pr-cleanup.yml.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  packages: write

# Rebuilds overwrite the same pr-<number> tag; cancel any in-flight build
# so two pushes can't race each other.
concurrency:
  group: pr-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      !github.event.pull_request.draft && (
        (github.event.action == 'labeled' && github.event.label.name == 'test-image') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'test-image'))
      )
    runs-on: ubuntu-latest
    steps:
      # Same-repo PRs only, so the default checkout (PR merged into main)
      # is exactly what you want to test. Forks are intentionally not
      # covered: GITHUB_TOKEN can't push their builds to GHCR.
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Separate package from the release images so consumers of
          # ghcr.io/<repo> never see test artifacts. type=pr -> pr-<number>.
          images: ghcr.io/${{ github.repository }}-preview
          tags: type=pr

      - uses: docker/build-push-action@v6
        with:
          context: ./poller
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
