name: docker-pr-build

# Builds Docker images for SELECTED pull requests only, via two paths:
# - Add the `test-image` label to a PR (same-repo branches). Pushing new
#   commits to a labeled PR rebuilds and overwrites the same tag. Remove
#   the label to stop building.
# - Manually run this workflow with a PR number (Actions tab). This is the
#   path for fork PRs: the run happens on the base repo with your token,
#   so GHCR push works where the automatic `pull_request` event can't.
# Images are deleted on PR close by docker-pr-cleanup.yml.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build (also works for fork PRs)'
        required: true
        type: number

permissions:
  contents: read
  packages: write

# Rebuilds overwrite the same pr-<number> tag; cancel any in-flight build
# so two pushes (or a manual run racing an automatic one) can't race it.
concurrency:
  group: pr-image-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft && (
        (github.event.action == 'labeled' && github.event.label.name == 'test-image') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'test-image'))
      )
    runs-on: ubuntu-latest
    steps:
      # Default checkout is the PR merged into main — exactly what you
      # want to test. (Fork PRs can't use this job: GITHUB_TOKEN can't
      # push their builds to GHCR. Use the manual job below instead.)
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          # Separate package from the release images so consumers of
          # ghcr.io/<repo> never see test artifacts.
          # v6 removed type=pr; type=ref,event=pr with default prefix
          # produces the same pr-<number> tag.
          images: ghcr.io/${{ github.repository }}-preview
          tags: type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: ./poller
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual path: run from the Actions tab with a PR number. Runs on the
  # base repo with your token, so it covers fork PRs too. Each run is an
  # explicit maintainer action — nothing fork-controlled triggers it.
  build-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # -R: this step runs before checkout, so the workspace is not a
          # git repo yet and gh cannot infer the repo from remotes.
          pr_json=$(gh pr view "${{ inputs.pr_number }}" -R "${{ github.repository }}" --json headRefOid,state,headRepository --jq '{sha: .headRefOid, state: .state, fork: .headRepository.isFork}')
          echo "$pr_json"
          state=$(echo "$pr_json" | jq -r .state)
          if [ "$state" != "OPEN" ]; then
            echo "::error::PR #${{ inputs.pr_number }} is $state, not OPEN. Refusing to build."
            exit 1
          fi
          echo "sha=$(echo "$pr_json" | jq -r .sha)" >> "$GITHUB_OUTPUT"
          echo "fork=$(echo "$pr_json" | jq -r .fork)" >> "$GITHUB_OUTPUT"

      # Pinned to the resolved SHA (not a branch ref) so a push landing
      # mid-run can't change what's built. persist-credentials keeps the
      # token out of git config, away from the untrusted build below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: ./poller
          push: true
          tags: ghcr.io/${{ github.repository }}-preview:pr-${{ inputs.pr_number }}
          labels: |
            org.opencontainers.image.revision=${{ steps.pr.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
