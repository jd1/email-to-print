name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r poller/requirements.txt -r tests/requirements_test.txt

      # pytest collects both the unittest classes (test_poller.py) and the
      # e2e suite, so this one run is the whole suite (minus slow).
      # Local e2e tests need the mox binary only (fake Gotenberg/lp are in-repo).
      # setup-go is present, so `go install` (GOSUMDB-verified) is the install
      # path; the gobuilds mirror is only for dev machines without Go (Makefile).
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install mox (local test mail server)
        run: |
          mkdir -p .tools
          MOX_VERSION=$(grep -oP 'MOX_VERSION = "\K[^"]+' tests/conftest.py)
          GOBIN=$PWD/.tools go install github.com/mjl-/mox@${MOX_VERSION}

      - run: python -m pytest -m "not slow"

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ./poller
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
