services:
  # Optional: only if you use ProtonMail. Any IMAP provider works;
  # point IMAP_HOST/IMAP_PORT at it directly and delete this service.
  # This is a COMMUNITY image handling your mail credentials, pinned to the
  # digest I actually run. Review it, re-pin it, or replace it with your own
  # build if supply chain risk keeps you up at night. It should.
  protonmail-bridge:
    image: ghcr.io/videocurio/proton-mail-bridge@sha256:d44f6b12650c6b0f9e0aefee192d65c6e46d0a22bd5ec189e8624812fd139c8b
    container_name: protonmail-bridge
    restart: unless-stopped
    volumes:
      - bridge-data:/root
    network_mode: host   # exposes IMAP on 127.0.0.1:1143, SMTP on 127.0.0.1:1025

  # Document conversion for the poller (LibreOffice + Chromium routes).
  # Bound to localhost only. If you already run Gotenberg (e.g. for
  # Paperless-ngx), delete this service and point GOTENBERG_URL at the
  # existing instance instead.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

  # Image published by .github/workflows/docker-publish.yml on pushes to main
  # and on v* tags. To develop locally: `build: ./poller` instead of `image:`.
  print-poller:
    image: ghcr.io/jd1/email-to-print:latest
    container_name: print-poller
    restart: unless-stopped
    network_mode: host   # needs to reach the bridge on localhost, cupsd and Gotenberg on the host
    env_file: .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bridge-data:
